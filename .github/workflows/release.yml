name: Publish signed release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag, for example v1.0.1'
        required: true
        type: string
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Check release version and download signed asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("release-config.json"))["version"])')
          test "$RELEASE_TAG" = "v$version"
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("Use a published stable release") else "Release ready" end'
          mkdir -p incoming
          gh release download "$RELEASE_TAG" --pattern "ipage-quick-links-$version.xpi" --dir incoming
          python3 release.py finalize "incoming/ipage-quick-links-$version.xpi"
      - name: Save updated feed and download page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/updates.json docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Publish signed add-on update feed'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
